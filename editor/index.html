<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Binary Inspector</title>
    <link rel="stylesheet" href="./ui.css" />
  </head>
  <body>
    <header class="toolbar">
      <div id="breadcrumbs" class="breadcrumbs">
        <strong>Binary Inspector</strong>
      </div>
      <button id="openFile" title="Open a local binary file">Open file…</button>
      <input id="filePicker" type="file" hidden />
    </header>
    <div id="notice" class="notice" role="status" hidden></div>
    <div class="layout">
      <nav aria-label="Inspection sections" id="navigation"></nav>
      <select id="compactNavigation" aria-label="Inspection section"></select>
      <main id="main" tabindex="-1">
        <div id="welcome" class="welcome">
          <div class="welcome-icon" aria-hidden="true">01</div>
          <h1>Binary Inspector</h1>
          <p>
            Inspect sections, symbols, archive objects and bytes.<br />Open a
            binary or try a small demonstration.
          </p>
          <div class="actions">
            <button id="demoObject">Try ELF object</button
            ><button id="demoArchive">Try static archive</button>
          </div>
          <p class="muted small">
            ELF · PE / COFF · AR archives · Up to 64 MiB<br />Drop a file
            anywhere to open it.
          </p>
        </div>
        <section id="pane-overview" class="pane" hidden></section>
        <section id="pane-table" class="pane table-pane" hidden>
          <div class="section-toolbar">
            <h1 id="tableTitle"></h1>
            <input
              id="tableFilter"
              type="search"
              placeholder="Filter by name…"
              aria-label="Filter table"
            />
            <select id="symbolKind" aria-label="Symbol type" hidden>
              <option value="all">All symbols</option>
              <option value="function">Functions</option>
              <option value="data">Data</option>
              <option value="import">Imports</option>
              <option value="export">Exports</option>
            </select>
            <span id="tableCount" class="muted count" aria-live="polite"></span>
          </div>
          <div id="tableScroll" class="table-scroll"></div>
          <div id="pagination" class="pagination"></div>
        </section>
        <section id="pane-hex" class="pane hex-pane" hidden>
          <div class="section-toolbar hex-toolbar">
            <select id="searchMode" aria-label="Search mode">
              <option value="hex">Hex</option>
              <option value="text">Text (UTF-8)</option>
            </select>
            <input
              id="byteSearch"
              type="search"
              placeholder="7F 45 4C 46"
              aria-label="Search bytes"
            />
            <button id="findBytes">Find</button
            ><button id="previousMatch" title="Previous match">↑</button
            ><button id="nextMatch" title="Next match">↓</button>
            <span id="matchCount" class="muted count" aria-live="polite"></span>
            <label class="offset-control"
              >Go to
              <input
                id="offsetInput"
                placeholder="0x0000"
                aria-label="File offset"
            /></label>
            <button id="toggleInspector" aria-expanded="true">Inspector</button>
          </div>
          <div class="hex-layout">
            <div
              id="hexViewport"
              tabindex="0"
              aria-label="Hex bytes. Use arrow keys to select a byte."
            >
              <div id="hexSpacer"></div>
              <div id="hexRows"></div>
            </div>
            <aside id="inspector" aria-label="Selected byte values"></aside>
          </div>
        </section>
      </main>
    </div>
    <footer>
      <span id="statusFile">No file open</span><span id="statusOffset"></span
      ><span id="statusTask" role="status"></span>
    </footer>
    <div id="dropHint" hidden>Drop binary file to inspect</div>
    <script type="module" src="./ui.mjs"></script>
  </body>
</html>
